<path d="M150,488 C150,430 162,400 180,382" fill="none" stroke="#2856A0" stroke-width="10" stroke-linecap="round" opacity=".55"/>
<path d="M216,338 L256,376 L296,338" fill="#FFF7E8" stroke="#2B1E16" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" />
<path d="M232,352 L250,420 M280,352 L262,420" stroke="#0B6E77" stroke-width="7" stroke-linecap="round"/>
<g transform="translate(256 448) rotate(-4)">
  <rect x="-34" y="-34" width="68" height="78" rx="10" fill="#FFF7E8" stroke="#2B1E16" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
  <rect x="-34" y="-34" width="68" height="20" rx="8" fill="#0B6E77"/>
  <circle cx="0" cy="6" r="11" fill="#3D7DD8"/>
  <rect x="-20" y="22" width="40" height="6" rx="3" fill="#C9BBA6"/>
