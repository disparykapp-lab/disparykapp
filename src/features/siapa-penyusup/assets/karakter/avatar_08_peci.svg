.halo{animation:halo 2.2s ease-in-out infinite}
@keyframes halo{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ghost{animation:ghost 3.2s ease-in-out infinite}
@keyframes ghost{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
