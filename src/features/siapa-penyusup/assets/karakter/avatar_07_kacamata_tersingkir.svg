<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<title>Avatar 07 kacamata - Tersingkir</title>
<defs><filter id="gray"><feColorMatrix type="saturate" values=".15"/></filter></defs>
<style>
.av{animation:idle 2.8s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.eyes{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.aura{animation:aura 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes aura{0%,100%{transform:scale(.95);opacity:.5}50%{transform:scale(1.05);opacity:.85}}
.halo{animation:halo 2.2s ease-in-out infinite}
@keyframes halo{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ghost{animation:ghost 3.2s ease-in-out infinite}
@keyframes ghost{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g class="ghost" opacity=".78"><g filter="url(#gray)">
