<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1920" width="1920" height="1920" preserveAspectRatio="xMidYMid slice">
<title>Background Diskusi - siang</title>
<defs>

<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4FB8D6"/><stop offset=".55" stop-color="#9EDFE6"/><stop offset=".72" stop-color="#E6F8F1"/></linearGradient>
<radialGradient id="sunglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6C9" stop-opacity=".95"/><stop offset="1" stop-color="#FFF6C9" stop-opacity="0"/></radialGradient>
<linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC36B"/><stop offset="1" stop-color="#3E8E52"/></linearGradient>
<pattern id="kawung" width="80" height="80" patternUnits="userSpaceOnUse">
  <g fill="#0B6E77" opacity="0.1"><ellipse cx="40.0" cy="22.4" rx="8.8" ry="16.0" transform="rotate(45 40.0 40.0)"/><ellipse cx="40.0" cy="22.4" rx="8.8" ry="16.0" transform="rotate(135 40.0 40.0)"/><ellipse cx="40.0" cy="22.4" rx="8.8" ry="16.0" transform="rotate(225 40.0 40.0)"/><ellipse cx="40.0" cy="22.4" rx="8.8" ry="16.0" transform="rotate(315 40.0 40.0)"/><circle cx="40.0" cy="40.0" r="4.0"/>
  <circle cx="0" cy="0" r="4.0"/><circle cx="80" cy="0" r="4.0"/><circle cx="0" cy="80" r="4.0"/><circle cx="80" cy="80" r="4.0"/></g>
</pattern>

