<style>

.drift-slow{animation:drift 140s linear infinite}
.drift{animation:drift 90s linear infinite}
.drift-fast{animation:drift 55s linear infinite}
@keyframes drift{from{transform:translateX(-700px)}to{transform:translateX(2400px)}}
.twinkle{animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.sway{animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.glint{animation:glint 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glint{0%,100%{opacity:.6;scale:.8}50%{opacity:1;scale:1.4}}
.smoke{animation:smoke 8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:.7}100%{opacity:0;transform:translate(90px,-320px) scale(2.6)}}
.birds{animation:birds 38s linear infinite}
@keyframes birds{from{transform:translateX(-300px)}to{transform:translateX(2300px)}}
.flap{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{from{scale:1 1}to{scale:1 .35}}
.wave{animation:wave 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:top left}
@keyframes wave{0%,100%{transform:skewY(0deg) scaleX(1)}50%{transform:skewY(6deg) scaleX(.85)}}
.pulse{animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.35;scale:1}50%{opacity:.6;scale:1.08}}
.rotate-slow{animation:rot 60s linear infinite;transform-box:view-box;transform-origin:960px 960px}
.rotate-slow-rev{animation:rot 90s linear infinite reverse;transform-box:view-box;transform-origin:960px 960px}
@keyframes rot{to{rotate:360deg}}
.fall{animation:fall 8s linear infinite}
@keyframes fall{from{transform:translateY(-80px)}to{transform:translateY(2000px)}}
.spin{animation:spin 2s linear infinite}
@keyframes spin{0%{transform:rotateX(0) rotate(0)}100%{transform:rotateX(360deg) rotate(360deg)}}
.beam{animation:beam 7s ease-in-out infinite;transform-box:view-box}
@keyframes beam{0%,100%{rotate:-18deg}50%{rotate:18deg}}
.curtain{animation:curtain 6s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}
@keyframes curtain{0%,100%{transform:skewX(0)}50%{transform:skewX(1.5deg)}}
.bob{animation:bob 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

