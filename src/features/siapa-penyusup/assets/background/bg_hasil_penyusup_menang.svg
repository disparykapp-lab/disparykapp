<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1920" width="1920" height="1920" preserveAspectRatio="xMidYMid slice">
<title>Background Hasil - Penyusup menang</title>
<defs>

<radialGradient id="bgG" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#C2345A"/><stop offset=".5" stop-color="#6E1329"/><stop offset="1" stop-color="#1C0A16"/></radialGradient>
<radialGradient id="fog" cx=".5" cy="1" r=".8"><stop offset="0" stop-color="#2A0C1C" stop-opacity=".9"/><stop offset="1" stop-color="#2A0C1C" stop-opacity="0"/></radialGradient>

